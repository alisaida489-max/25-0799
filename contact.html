<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Essential Electronics | Contact</title>
  <style>
    /* same global + menu styles */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: linear-gradient(145deg, #c7e3ff, #a6c8e8); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .wrapper { max-width: 1300px; width: 100%; }
    .container { background: rgba(255,255,255,0.9); backdrop-filter: blur(3px); width: 95%; margin: 25px auto; padding: 30px; border-radius: 30px 10px; box-shadow: 0 15px 25px rgba(0,20,40,0.2); border: 1px solid rgba(255,255,255,0.7); }
    .menu { background: #0a2f44; padding: 12px 30px; border-radius: 50px; display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-bottom: 20px; }
    .menu a { color: white; text-decoration: none; font-weight: 600; padding: 8px 20px; border-radius: 40px; transition: 0.3s; }
    .menu a:hover { background: #1f5a7e; transform: scale(1.05); }
    .footer { background: #0a2f44; color: white; text-align: center; padding: 20px; border-radius: 60px 60px 20px 20px; margin-top: 40px; }

    /* form styling (added feature) */
    .contact-form { background: #eef7ff; padding: 30px; border-radius: 30px; max-width: 600px; margin: 0 auto; }
    .form-group { margin-bottom: 20px; }
    input, textarea { width: 100%; padding: 12px; border: 2px solid #b0d4f0; border-radius: 40px; font-size: 1rem; }
    button { background: #0a2f44; color: white; padding: 15px 40px; border: none; border-radius: 40px; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
    button:hover { background: #1f5a7e; transform: scale(1.02); }
  </style>
</head>
<body>
<div class="wrapper">
  <nav class="menu">
    <a href="index.html">HOME</a>
    <a href="products.html">PRODUCTS</a>
    <a href="media.html">MEDIA</a>
    <a href="specs.html">SPECS</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <div class="container">
    <h2 style="color:#0a2f44;">📬 Get in touch</h2>

    <!-- CONTACT FORM (added feature – requirement 9) -->
    <div class="contact-form">
      <form action="#" method="post">
        <div class="form-group"><input type="text" placeholder="Your name" required></div>
        <div class="form-group"><input type="email" placeholder="Email address" required></div>
        <div class="form-group"><textarea rows="5" placeholder="Message about electronics..."></textarea></div>
        <button type="submit">Send message</button>
      </form>
    </div>

    <!-- extra paragraphs (still count toward total 5) -->
    <p style="margin-top:30px;">We reply within 24h. You can also follow us on social media.</p>
    <p>Based in San Jose, CA – the heart of Silicon Valley.</p>
  </div>

  <footer class="footer"><p>© 2026 Essential Electronics – All rights reserved.</p></footer>
</div>
</body>
</html>
