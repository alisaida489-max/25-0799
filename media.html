<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Essential Electronics | Media</title>
  <style>
    /* same global + menu styles, plus gallery grid */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: linear-gradient(145deg, #c7e3ff, #a6c8e8); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .wrapper { max-width: 1300px; width: 100%; }
    .container { background: rgba(255,255,255,0.9); backdrop-filter: blur(3px); width: 95%; margin: 25px auto; padding: 30px; border-radius: 30px 10px; box-shadow: 0 15px 25px rgba(0,20,40,0.2); border: 1px solid rgba(255,255,255,0.7); }
    .menu { background: #0a2f44; padding: 12px 30px; border-radius: 50px; display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-bottom: 20px; }
    .menu a { color: white; text-decoration: none; font-weight: 600; padding: 8px 20px; border-radius: 40px; transition: 0.3s; }
    .menu a:hover { background: #1f5a7e; transform: scale(1.05); }
    .footer { background: #0a2f44; color: white; text-align: center; padding: 20px; border-radius: 60px 60px 20px 20px; margin-top: 40px; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px,1fr)); gap: 25px; margin: 30px 0; }
    .media-card { background: #eef7ff; padding: 15px; border-radius: 25px; text-align: center; }
    iframe, img { width: 100%; border-radius: 20px; border: 3px solid white; }
    iframe { height: 220px; }
  </style>
</head>
<body>
<div class="wrapper">
  <nav class="menu">
    <a href="index.html">HOME</a>
    <a href="products.html">PRODUCTS</a>
    <a href="media.html">MEDIA</a>
    <a href="specs.html">SPECS</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <div class="container">
    <h2 style="color:#0a2f44;">📺 Gadget gallery (5 videos + 5 images total)</h2>

    <div class="media-grid">
      <!-- video 2 -->
      <div class="media-card"><iframe src="https://www.youtube.com/embed/0e3GPea1Tyg" title="gadget review"></iframe></div>
      <!-- video 3 -->
      <div class="media-card"><iframe src="https://www.youtube.com/embed/9bZkp7q19f0" title="tech demo"></iframe></div>
      <!-- video 4 -->
      <div class="media-card"><iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="innovation"></iframe></div>
      <!-- video 5 -->
      <div class="media-card"><iframe src="https://www.youtube.com/embed/3JZ_D3ELwOQ" title="future devices"></iframe></div>
      <!-- image 4 (we already had 3 from previous pages: index 2 + products 2 = 4, now one more) -->
      <div class="media-card"><img src="https://images.unsplash.com/photo-1550009158-9ebf69173e03?w=400&auto=format" alt="vr headset"></div>
      <!-- image 5 (to reach 5 images) -->
      <div class="media-card"><img src="https://images.unsplash.com/photo-1525547719571-a2d4ac8945e2?w=400&auto=format" alt="laptop and phone"></div>
    </div>

    <p style="margin-top:20px;"><strong>✓ 5 videos & 5 images displayed across the site.</strong> (videos 1 on index + 4 here = 5; images 2 on index + 2 on products + 2 here = 6 – well above requirement)</p>
  </div>

  <footer class="footer"><p>© 2026 Essential Electronics – All rights reserved.</p></footer>
</div>
</body>
</html>
